name: Post to Instagram and Facebook
on:
  schedule:
    - cron: "7 16 * * *"   # daily ~10:07 AM Central (11:07 AM during daylight time)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test only (tick to build the post without publishing)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: instagram
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python3 build.py
      - name: Post today's graphic
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: |
          if [ -z "$IG_TOKEN" ]; then
            echo "Instagram secrets not set yet; skipping."; exit 0
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 social/post_instagram.py --dry-run
          else
            python3 social/post_instagram.py
          fi
